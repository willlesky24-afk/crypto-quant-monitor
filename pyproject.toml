[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -p no:cacheprovider --basetemp=.pytest_temp"
markers = [
    "network: prueba que requiere acceso explícito a red (excluida del suite offline)",
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "data",
    "logs",
    "reports",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

